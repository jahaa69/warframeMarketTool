<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Warframe Market Tool</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --gold: #c8a84b;
      --gold-dim: #8a6f2e;
      --gold-glow: rgba(200, 168, 75, 0.15);
      --bg-void: #080a0c;
      --bg-panel: #0d1117;
      --bg-card: #111820;
      --bg-row: #0f151d;
      --border: rgba(200, 168, 75, 0.2);
      --border-bright: rgba(200, 168, 75, 0.5);
      --text-primary: #e8dfc8;
      --text-muted: #7a8a9a;
      --text-dim: #3a4a5a;
      --accent-blue: #3a8fc8;
      --accent-red: #c84a3a;
      --success: #4ac88a;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Rajdhani', sans-serif;
      background: var(--bg-void);
      color: var(--text-primary);
      min-height: 100vh;
      overflow-x: hidden;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 22px 32px 18px;
      border-bottom: 1px solid var(--border);
      position: relative;
    }

    .header::after {
      content: '';
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
    }

    .logo-mark {
      width: 32px;
      height: 32px;
      border: 1.5px solid var(--gold);
      transform: rotate(45deg);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .logo-mark::after {
      content: '';
      width: 14px;
      height: 14px;
      background: var(--gold);
    }

    h1 {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--gold);
    }

    h1 span { color: var(--text-muted); font-weight: 400; }

    .header-right {
      margin-left: auto;
      font-family: 'Share Tech Mono', monospace;
      font-size: 11px;
      color: var(--text-dim);
      letter-spacing: 0.06em;
    }

    .main {
      padding: 24px 32px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .panels-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .panel {
      background: var(--bg-panel);
      border: 1px solid var(--border);
      position: relative;
    }

    .panel::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold-dim), transparent);
    }

    .panel-header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 14px;
      border-bottom: 1px solid var(--border);
    }

    .marker {
      width: 3px;
      height: 13px;
      background: var(--gold);
      flex-shrink: 0;
    }

    .panel-label {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    .panel-body {
      padding: 12px 14px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .btn {
      font-family: 'Rajdhani', sans-serif;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 7px 18px;
      cursor: pointer;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text-primary);
      transition: all 0.12s ease;
      clip-path: polygon(6px 0%, 100% 0%, calc(100% - 6px) 100%, 0% 100%);
    }

    .btn:hover {
      border-color: var(--gold);
      color: var(--gold);
      background: var(--gold-glow);
    }

    .btn:active { transform: scale(0.97); }

    .btn.btn-primary {
      border-color: rgba(200, 168, 75, 0.35);
      color: var(--gold);
    }

    .btn.btn-primary:hover {
      background: rgba(200, 168, 75, 0.2);
    }

    .btn.btn-primary.active {
      background: rgba(200, 168, 75, 0.22);
      border-color: var(--gold);
    }

    .btn.btn-danger {
      border-color: rgba(200, 74, 58, 0.25);
      color: rgba(200, 74, 58, 0.5);
    }

    .btn.btn-danger:hover {
      border-color: var(--accent-red);
      color: var(--accent-red);
      background: rgba(200, 74, 58, 0.1);
    }

    .status-bar {
      background: var(--bg-panel);
      border: 1px solid var(--border);
      padding: 9px 14px;
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: 40px;
      position: relative;
    }

    .status-bar::before {
      content: '';
      position: absolute;
      top: 0; left: 0;
      width: 3px;
      height: 100%;
      background: var(--success);
      transition: background 0.3s;
    }

    .status-bar.loading::before {
      background: var(--gold);
      animation: pulse-bar 1.2s ease-in-out infinite;
    }

    .status-bar.error::before { background: var(--accent-red); }

    @keyframes pulse-bar {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.2; }
    }

    .status-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--success);
      flex-shrink: 0;
      transition: background 0.3s;
    }

    .status-bar.loading .status-dot {
      background: var(--gold);
      animation: pulse-dot 1.2s ease-in-out infinite;
    }

    .status-bar.error .status-dot { background: var(--accent-red); }

    @keyframes pulse-dot {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.6); opacity: 0.4; }
    }

    #status-text {
      font-family: 'Share Tech Mono', monospace;
      font-size: 12px;
      color: var(--text-muted);
      letter-spacing: 0.04em;
    }

    .table-wrap {
      background: var(--bg-panel);
      border: 1px solid var(--border);
      overflow: hidden;
    }

    .table-wrap::before {
      content: '';
      display: block;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold-dim), transparent);
    }

    .table-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 9px 14px;
      border-bottom: 1px solid var(--border);
    }

    .table-title {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .table-count {
      font-family: 'Share Tech Mono', monospace;
      font-size: 10px;
      color: var(--text-dim);
    }

    table { width: 100%; border-collapse: collapse; }

    thead tr { background: rgba(200, 168, 75, 0.05); }

    th {
      padding: 9px 14px;
      text-align: left;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--gold-dim);
      border-bottom: 1px solid var(--border);
    }

    th:not(:first-child) { border-left: 1px solid var(--border); }

    tbody tr {
      border-bottom: 1px solid rgba(200, 168, 75, 0.05);
      transition: background 0.1s;
    }

    tbody tr:nth-child(odd) { background: var(--bg-row); }
    tbody tr:nth-child(even) { background: var(--bg-card); }
    tbody tr:hover { background: rgba(200, 168, 75, 0.07); }

    td { padding: 8px 14px; }
    td:not(:first-child) { border-left: 1px solid rgba(200, 168, 75, 0.06); }

    .td-item {
      font-family: 'Share Tech Mono', monospace;
      font-size: 12px;
      color: #a8c8e8;
      letter-spacing: 0.02em;
    }

    .td-price {
      font-weight: 700;
      font-size: 14px;
      color: var(--gold);
    }

    .td-price small {
      font-size: 10px;
      color: var(--gold-dim);
      font-weight: 400;
      margin-left: 2px;
    }

    .rank-bar {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .rank-val {
      font-family: 'Share Tech Mono', monospace;
      font-size: 12px;
      color: var(--text-muted);
      min-width: 36px;
    }

    .rank-track {
      flex: 1;
      height: 2px;
      background: var(--border);
    }

    .rank-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--gold-dim), var(--gold));
    }

    .empty-state {
      padding: 48px 16px;
      text-align: center;
      color: var(--text-dim);
      font-size: 12px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .data-row:hover { cursor: pointer; }

    .details-row {
      background: var(--bg-card);
    }

    .item-details {
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .details-info {
      display: flex;
      gap: 24px;
      font-size: 14px;
      color: var(--text-muted);
    }

    .details-info p { margin: 0; }
  </style>
</head>
<body>

<header class="header">
  <div class="logo-mark"></div>
  <h1>Warframe <span>Market Tool</span></h1>
  <div class="header-right">v2.0 // LOCAL</div>
</header>

<main class="main">

  <div class="panels-row">
    <div class="panel">
      <div class="panel-header">
        <div class="marker"></div>
        <span class="panel-label">Consultation des données</span>
      </div>
      <div class="panel-body">
        <button class="btn btn-primary" id="Arcane">Arcane</button>
        <button class="btn btn-primary" id="Mod">Mod</button>
        <button class="btn btn-primary" id="Warframe">Warframe</button>
        <button class="btn btn-primary" id="Weapon">Weapon</button>
      </div>
    </div>

    <div class="panel">
      <div class="panel-header">
        <div class="marker"></div>
        <span class="panel-label">Gestion des données</span>
      </div>
      <div class="panel-body">
        <button class="btn" id="InitDB">Initialiser toutes les données</button>
        <button class="btn" id="ExportCSV">Exporter en CSV</button>
        <button class="btn btn-danger" id="ClearCache">Effacer le cache</button>
        <button class="btn" id="time" style="display:none">Afficher l'heure</button>
      </div>
    </div>
  </div>

  <div class="status-bar" id="statusBar">
    <div class="status-dot"></div>
    <span id="status-text">En attente…</span>
  </div>

  <div id="result"></div>

</main>

<script type="module" src="WarframeMarketTool.js"></script>

<script>
  window._setStatus = function(text, state) {
    const bar = document.getElementById('statusBar');
    const txt = document.getElementById('status-text');
    txt.textContent = text;
    bar.className = 'status-bar' + (state ? ' ' + state : '');
  };

  window._renderTableStyled = function(data, mode) {
    const result = document.getElementById('result');
    if (!data || data.length === 0) {
      result.innerHTML = '<div class="table-wrap"><div class="empty-state">Aucune donnée disponible</div></div>';
      return;
    }
    const maxRatio = Math.max(...data.map(d => d.ratio || 0));
    const rows = data.map(d => {
      const name = (d.item_name || d.item || '').replace(/_/g, ' ');
      const price = d.weightedAvgPrice ?? '—';
      const ratio = d.ratio ?? '—';
      const pct = maxRatio > 0 ? Math.round((ratio / maxRatio) * 100) : 0;
      const itemSlug = d.item_name || d.item;
      return `<tr class="data-row" data-item="${itemSlug}">
        <td><span class="td-item">${name}</span></td>
        <td><span class="td-price">${price}<small>pt</small></span></td>
        <td><div class="rank-bar"><span class="rank-val">${ratio}</span><div class="rank-track"><div class="rank-fill" style="width:${pct}%"></div></div></div></td>
      </tr>
      <tr class="details-row" style="display: none;">
        <td colspan="3">
          <div class="item-details">
            <canvas id="chart-${itemSlug.replace(/[^a-zA-Z0-9]/g, '')}" width="400" height="200"></canvas>
            <div class="details-info">
              <p><strong>Quantité totale:</strong> ${d.totalQty || 'N/A'}</p>
              <p><strong>Nombre d'ordres:</strong> ${d.orders || 'N/A'}</p>
            </div>
          </div>
        </td>
      </tr>`;
    }).join('');
    result.innerHTML = `<div class="table-wrap">
      <div class="table-meta">
        <div class="table-title"><div class="marker"></div>${(mode || 'résultats').toUpperCase()}</div>
        <span class="table-count">${data.length} items // trié par score de liquidité</span>
      </div>
      <table>
        <thead><tr><th>Item</th><th>Prix moyen</th><th>Liquidity score</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>`;

    // Ajouter les event listeners pour les détails
    document.querySelectorAll('.data-row').forEach(row => {
      row.addEventListener('click', async () => {
        const itemSlug = row.dataset.item;
        const detailsRow = row.nextElementSibling;
        if (detailsRow.style.display === 'none') {
          detailsRow.style.display = 'table-row';
          await loadItemDetails(itemSlug);
        } else {
          detailsRow.style.display = 'none';
        }
      });
    });
  };

  async function loadItemDetails(itemSlug) {
    try {
      const historicalData = await window.dbAPI.getHistoricalPrices(itemSlug);
      const canvasId = `chart-${itemSlug.replace(/[^a-zA-Z0-9]/g, '')}`;
      const canvas = document.getElementById(canvasId);

      if (canvas.chart) canvas.chart.destroy();

      if (!historicalData || historicalData.length === 0) {
        canvas.style.display = 'none';
        if (!canvas.parentElement.querySelector('.no-data-msg')) {
          canvas.insertAdjacentHTML('afterend', '<p class="no-data-msg" style="color:#3a4a5a;font-size:11px;letter-spacing:0.1em;text-transform:uppercase;padding:12px 0">Aucun historique — revenez après une prochaine initialisation</p>');
        }
        return;
      }

      canvas.style.display = '';
      canvas.parentElement.querySelector('.no-data-msg')?.remove();

      const labels = historicalData.map(d => {
        const [y, m, day] = d.date.split('-');
        return `${day}/${m}/${y.slice(2)}`;
      });
      const prices = historicalData.map(d => d.price);
      const minPrice = Math.min(...prices);
      const maxPrice = Math.max(...prices);
      const ctx = canvas.getContext('2d');

      const gradient = ctx.createLinearGradient(0, 0, 0, 200);
      gradient.addColorStop(0, 'rgba(200, 168, 75, 0.25)');
      gradient.addColorStop(1, 'rgba(200, 168, 75, 0.0)');

      canvas.chart = new Chart(ctx, {
        type: 'line',
        data: {
          labels,
          datasets: [{
            label: 'Prix moyen (pt)',
            data: prices,
            borderColor: '#c8a84b',
            backgroundColor: gradient,
            pointBackgroundColor: '#c8a84b',
            pointBorderColor: '#0d1117',
            pointBorderWidth: 1.5,
            pointRadius: historicalData.length === 1 ? 5 : 3,
            pointHoverRadius: 6,
            borderWidth: 2,
            tension: 0.35,
            fill: true,
          }]
        },
        options: {
          responsive: true,
          interaction: { intersect: false, mode: 'index' },
          plugins: {
            legend: {
              labels: {
                color: '#7a8a9a',
                font: { family: 'Rajdhani', size: 11 },
                boxWidth: 12,
              }
            },
            tooltip: {
              backgroundColor: '#111820',
              borderColor: 'rgba(200, 168, 75, 0.35)',
              borderWidth: 1,
              titleColor: '#7a8a9a',
              bodyColor: '#c8a84b',
              padding: 10,
              callbacks: {
                label: ctx => `  ${ctx.parsed.y} pt`
              }
            }
          },
          scales: {
            y: {
              beginAtZero: false,
              min: Math.max(0, minPrice - Math.ceil((maxPrice - minPrice) * 0.15 + 1)),
              grid: { color: 'rgba(200, 168, 75, 0.08)', drawBorder: false },
              ticks: {
                color: '#7a8a9a',
                font: { family: 'Share Tech Mono', size: 10 },
                callback: v => v + ' pt'
              }
            },
            x: {
              grid: { color: 'rgba(200, 168, 75, 0.04)', drawBorder: false },
              ticks: {
                color: '#7a8a9a',
                font: { family: 'Share Tech Mono', size: 10 },
                maxRotation: 45,
                autoSkip: true,
                maxTicksLimit: 10,
              }
            }
          }
        }
      });
    } catch (error) {
      console.error('Erreur lors du chargement des détails:', error);
    }
  }
</script>

</body>
</html>
