<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Warframe Market Tool</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <style>
    :root {
      --gold: #c8a84b;
      --gold-dim: #8a6f2e;
      --gold-glow: rgba(200, 168, 75, 0.15);
      --bg-void: #080a0c;
      --bg-panel: #0d1117;
      --bg-card: #111820;
      --bg-row: #0f151d;
      --border: rgba(200, 168, 75, 0.2);
      --border-bright: rgba(200, 168, 75, 0.5);
      --text-primary: #e8dfc8;
      --text-muted: #7a8a9a;
      --text-dim: #3a4a5a;
      --accent-blue: #3a8fc8;
      --accent-red: #c84a3a;
      --success: #4ac88a;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Rajdhani', sans-serif;
      background: var(--bg-void);
      color: var(--text-primary);
      min-height: 100vh;
      overflow-x: hidden;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 22px 32px 18px;
      border-bottom: 1px solid var(--border);
      position: relative;
    }

    .header::after {
      content: '';
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
    }

    .logo-mark {
      width: 32px;
      height: 32px;
      border: 1.5px solid var(--gold);
      transform: rotate(45deg);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .logo-mark::after {
      content: '';
      width: 14px;
      height: 14px;
      background: var(--gold);
    }

    h1 {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--gold);
    }

    h1 span { color: var(--text-muted); font-weight: 400; }

    .header-right {
      margin-left: auto;
      font-family: 'Share Tech Mono', monospace;
      font-size: 11px;
      color: var(--text-dim);
      letter-spacing: 0.06em;
    }

    .main {
      padding: 24px 32px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .panels-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .panel {
      background: var(--bg-panel);
      border: 1px solid var(--border);
      position: relative;
    }

    .panel::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold-dim), transparent);
    }

    .panel-header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 14px;
      border-bottom: 1px solid var(--border);
    }

    .marker {
      width: 3px;
      height: 13px;
      background: var(--gold);
      flex-shrink: 0;
    }

    .panel-label {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    .panel-body {
      padding: 12px 14px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .btn {
      font-family: 'Rajdhani', sans-serif;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 7px 18px;
      cursor: pointer;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text-primary);
      transition: all 0.12s ease;
      clip-path: polygon(6px 0%, 100% 0%, calc(100% - 6px) 100%, 0% 100%);
    }

    .btn:hover {
      border-color: var(--gold);
      color: var(--gold);
      background: var(--gold-glow);
    }

    .btn:active { transform: scale(0.97); }

    .btn.btn-primary {
      border-color: rgba(200, 168, 75, 0.35);
      color: var(--gold);
    }

    .btn.btn-primary:hover {
      background: rgba(200, 168, 75, 0.2);
    }

    .btn.btn-primary.active {
      background: rgba(200, 168, 75, 0.22);
      border-color: var(--gold);
    }

    .btn.btn-danger {
      border-color: rgba(200, 74, 58, 0.25);
      color: rgba(200, 74, 58, 0.5);
    }

    .btn.btn-danger:hover {
      border-color: var(--accent-red);
      color: var(--accent-red);
      background: rgba(200, 74, 58, 0.1);
    }

    /* Violet des mods Riven */
    .btn.btn-rivens {
      border-color: rgba(168, 102, 230, 0.45);
      color: #b88cf0;
      background: rgba(140, 82, 210, 0.08);
      text-shadow: 0 0 6px rgba(168, 102, 230, 0.35);
    }

    .btn.btn-rivens:hover {
      border-color: #a866e6;
      color: #d4b5ff;
      background: rgba(140, 82, 210, 0.22);
      text-shadow: 0 0 8px rgba(190, 140, 255, 0.8);
    }

    .status-bar {
      background: var(--bg-panel);
      border: 1px solid var(--border);
      padding: 9px 14px;
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: 40px;
      position: relative;
    }

    .status-bar::before {
      content: '';
      position: absolute;
      top: 0; left: 0;
      width: 3px;
      height: 100%;
      background: var(--success);
      transition: background 0.3s;
    }

    .status-bar.loading::before {
      background: var(--gold);
      animation: pulse-bar 1.2s ease-in-out infinite;
    }

    .status-bar.error::before { background: var(--accent-red); }

    @keyframes pulse-bar {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.2; }
    }

    .status-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--success);
      flex-shrink: 0;
      transition: background 0.3s;
    }

    .status-bar.loading .status-dot {
      background: var(--gold);
      animation: pulse-dot 1.2s ease-in-out infinite;
    }

    .status-bar.error .status-dot { background: var(--accent-red); }

    @keyframes pulse-dot {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.6); opacity: 0.4; }
    }

    #status-text {
      font-family: 'Share Tech Mono', monospace;
      font-size: 12px;
      color: var(--text-muted);
      letter-spacing: 0.04em;
    }

    .table-wrap {
      background: var(--bg-panel);
      border: 1px solid var(--border);
      overflow: hidden;
    }

    .table-wrap::before {
      content: '';
      display: block;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold-dim), transparent);
    }

    .table-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 9px 14px;
      border-bottom: 1px solid var(--border);
    }

    .table-title {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .table-count {
      font-family: 'Share Tech Mono', monospace;
      font-size: 10px;
      color: var(--text-dim);
    }

    table { width: 100%; border-collapse: collapse; }

    thead tr { background: rgba(200, 168, 75, 0.05); }

    th {
      padding: 9px 14px;
      text-align: left;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--gold-dim);
      border-bottom: 1px solid var(--border);
    }

    th:not(:first-child) { border-left: 1px solid var(--border); }

    tbody tr {
      border-bottom: 1px solid rgba(200, 168, 75, 0.05);
      transition: background 0.1s;
    }

    tbody tr:nth-child(odd) { background: var(--bg-row); }
    tbody tr:nth-child(even) { background: var(--bg-card); }
    tbody tr:hover { background: rgba(200, 168, 75, 0.07); }

    td { padding: 8px 14px; }
    td:not(:first-child) { border-left: 1px solid rgba(200, 168, 75, 0.06); }

    .td-item {
      font-family: 'Share Tech Mono', monospace;
      font-size: 12px;
      color: #a8c8e8;
      letter-spacing: 0.02em;
    }

    .td-price {
      font-weight: 700;
      font-size: 14px;
      color: var(--gold);
    }

    .td-price small {
      font-size: 10px;
      color: var(--gold-dim);
      font-weight: 400;
      margin-left: 2px;
    }

    .rank-bar {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .rank-val {
      font-family: 'Share Tech Mono', monospace;
      font-size: 12px;
      color: var(--text-muted);
      min-width: 36px;
    }

    .rank-track {
      flex: 1;
      height: 2px;
      background: var(--border);
    }

    .rank-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--gold-dim), var(--gold));
    }

    .empty-state {
      padding: 48px 16px;
      text-align: center;
      color: var(--text-dim);
      font-size: 12px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .data-row:hover { cursor: pointer; }

    .details-row {
      background: var(--bg-card);
    }

    .item-details {
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .details-info {
      display: flex;
      gap: 24px;
      font-size: 14px;
      color: var(--text-muted);
    }

    .details-info p { margin: 0; }

    /* Tri par colonne */
    th.sortable { cursor: pointer; user-select: none; transition: color 0.1s; }
    th.sortable:hover { color: var(--gold); }
    th.sorted { color: var(--gold); }
    .sort-arrow { font-size: 9px; }

    /* Pastille "moment de vendre" */
    .moment { display: inline-flex; align-items: center; gap: 7px; font-size: 12px; font-weight: 600;
              letter-spacing: 0.06em; text-transform: uppercase; white-space: nowrap; cursor: help; }
    .moment .dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; background: var(--text-dim); }
    .moment.bon { color: var(--success); }
    .moment.bon .dot { background: var(--success); box-shadow: 0 0 6px rgba(74, 200, 138, 0.7); }
    .moment.moyen { color: var(--gold); }
    .moment.moyen .dot { background: var(--gold); }
    .moment.attendre { color: var(--accent-red); }
    .moment.attendre .dot { background: var(--accent-red); }
    .moment.inconnu, .moment.loading { color: var(--text-dim); }
    .buy-tag { margin-left: 4px; padding: 1px 6px; font-size: 10px; color: var(--accent-blue); border: 1px solid rgba(58, 143, 200, 0.5); }
    .moment.loading .dot { animation: momentPulse 1s ease-in-out infinite; }
    @keyframes momentPulse { 50% { opacity: 0.3; } }

    /* Verdict "bon moment pour vendre ?" au-dessus de la courbe 90 jours */
    .baro-verdict { font-size: 14px; font-weight: 600; padding: 7px 12px; border-left: 3px solid; }
    .baro-verdict.bon { color: var(--success); border-color: var(--success); background: rgba(74, 200, 138, 0.08); }
    .baro-verdict.moyen { color: var(--gold); border-color: var(--gold); background: var(--gold-glow); }
    .baro-verdict.attendre { color: var(--accent-red); border-color: var(--accent-red); background: rgba(200, 74, 58, 0.08); }
    .baro-verdict.inconnu { color: var(--text-muted); border-color: var(--text-dim); }
  </style>
</head>
<body>

<header class="header">
  <div class="logo-mark"></div>
  <h1>Warframe <span>Market Tool</span></h1>
  <div class="header-right">v2.0 // LOCAL</div>
  <a class="btn" href="settings.html" title="Paramètres et diagnostic" style="text-decoration:none">⚙ Paramètres</a>
</header>

<main class="main">
  
  <div class="panels-row">
    <div class="panel">
      <div class="panel-header">
        <div class="marker"></div>
        <span class="panel-label">Consultation des données</span>
      </div>
      <div class="panel-body">
        <button class="btn btn-primary" id="Arcane">Arcane</button>
        <button class="btn btn-primary" id="Mod">Mod</button>
        <button class="btn btn-primary" id="Warframe">Warframe</button>
        <button class="btn btn-primary" id="Weapon">Weapon</button>
        <a class="btn btn-rivens" href="rivens.html" style="text-decoration:none">Rivens</a>
      </div>
    </div>
    
    <div class="panel">
      <div class="panel-header">
        <div class="marker"></div>
        <span class="panel-label">Gestion des données</span>
      </div>
      <div class="panel-body">
        <button class="btn" id="InitDB">Initialiser toutes les données</button>
        <button class="btn" id="ExportCSV">Exporter en CSV</button>
        <button class="btn btn-danger" id="ClearCache">Effacer le cache</button>
        <button class="btn" id="time" style="display:none">Afficher l'heure</button>
      </div>
    </div>
  </div>

  <div class="status-bar" id="statusBar">
    <div class="status-dot"></div>
    <span id="status-text">En attente…</span>
  </div>

  <div id="result"></div>

</main>

<script type="module" src="WarframeMarketTool.js"></script>

<script>
  window._setStatus = function(text, state) {
    const bar = document.getElementById('statusBar');
    const txt = document.getElementById('status-text');
    txt.textContent = text;
    bar.className = 'status-bar' + (state ? ' ' + state : '');
  };

  // ---------- Tableau : pastille "moment de vendre" (90 j warframe.market) + tri sur chaque colonne ----------
  // Construit avec createElement / textContent (les noms d'objets viennent de l'API).
  const verdictCache = new Map();          // slug -> verdict { level, text, medPct… } (rempli par /api/statistics)
  const LEVEL_ORDER = { bon: 0, moyen: 1, attendre: 2, inconnu: 3 };
  const LEVEL_LABEL = { bon: 'Bon moment', moyen: 'Normal', attendre: 'Attendre', inconnu: '—' };
  const slugOf = d => d.item_name || d.item || '';
  const nameOf = d => slugOf(d).replace(/_/g, ' ');
  const COLUMNS = [   // firstDir : sens du 1er clic (1 = croissant, -1 = décroissant)
    { key: 'moment', label: 'Moment', firstDir: 1,          // bon d'abord, puis le prix le plus haut sur 90 j
      value: d => { const v = verdictCache.get(slugOf(d)); return v ? LEVEL_ORDER[v.level] * 1000 - (v.medPct ?? 0) : 9999; } },
    { key: 'name', label: 'Item', firstDir: 1, value: nameOf },
    { key: 'price', label: 'Prix moyen', firstDir: -1, value: d => d.weightedAvgPrice ?? -1 },
    { key: 'ratio', label: 'Liquidity score', firstDir: -1, value: d => d.ratio ?? -1 },
  ];
  const tableState = { data: [], mode: null, sortKey: 'ratio', sortDir: -1, expanded: new Set() };
  const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
  const pause = ms => new Promise(r => setTimeout(r, ms));

  function momentBadge(slug) {
    const v = verdictCache.get(slug);
    const b = el('span', `moment ${v ? v.level : 'loading'}`);
    b.dataset.item = slug;
    b.append(el('span', 'dot'), el('span', 'moment-label', v ? LEVEL_LABEL[v.level] : '…'));
    if (v && v.buy) b.append(el('span', 'buy-tag', '🛒 achat'));
    b.title = v ? v.text : 'Analyse des 90 derniers jours sur warframe.market…';
    return b;
  }
  function setVerdict(slug, verdict) {
    verdictCache.set(slug, verdict);
    document.querySelectorAll('.moment').forEach(m => { if (m.dataset.item === slug) m.replaceWith(momentBadge(slug)); });
  }

  // Charge les verdicts un par un en arrière-plan (cache 6 h côté main.js) ; abandonne si un autre tableau s'affiche
  let verdictRun = 0;
  async function loadVerdicts(slugs) {
    const run = ++verdictRun;
    for (const slug of slugs) {
      if (run !== verdictRun) return;
      if (verdictCache.has(slug)) continue;
      for (let attempt = 0; attempt < 3 && !verdictCache.has(slug); attempt++) {
        try {
          const res = await fetch(`/api/statistics/${encodeURIComponent(slug)}`);
          const s = await res.json();
          if (res.ok) setVerdict(slug, s.verdict);
          else if (/429/.test(s.error || '') && attempt < 2) await pause(5000 * (attempt + 1));   // trop de requêtes
          else setVerdict(slug, { level: 'inconnu', text: `Indisponible : ${s.error || res.status}` });
        } catch (e) { setVerdict(slug, { level: 'inconnu', text: `Indisponible : ${e.message}` }); }
      }
      await pause(350);
    }
  }

  function renderTable() {
    const { data, mode } = tableState;
    const col = COLUMNS.find(c => c.key === tableState.sortKey);
    const sorted = [...data].sort((a, b) => {
      const x = col.value(a), y = col.value(b);
      return (typeof x === 'string' ? x.localeCompare(y) : x - y) * tableState.sortDir;
    });
    const maxRatio = Math.max(...data.map(d => d.ratio || 0));
    const arrow = tableState.sortDir > 0 ? '▲' : '▼';

    const wrap = el('div', 'table-wrap'), meta = el('div', 'table-meta'), title = el('div', 'table-title');
    title.append(el('div', 'marker'), (mode || 'résultats').toUpperCase());
    meta.append(title, el('span', 'table-count', `${data.length} items // trié par ${col.label.toLowerCase()} ${arrow}`));

    const table = el('table'), thead = el('thead'), htr = el('tr');
    for (const c of COLUMNS) {
      const th = el('th', 'sortable' + (c.key === tableState.sortKey ? ' sorted' : ''), c.label);
      if (c.key === tableState.sortKey) th.append(el('span', 'sort-arrow', ` ${arrow}`));
      th.title = `Trier par ${c.label.toLowerCase()} (re-cliquer pour inverser)`;
      th.onclick = () => {
        if (tableState.sortKey === c.key) tableState.sortDir *= -1;
        else { tableState.sortKey = c.key; tableState.sortDir = c.firstDir; }
        renderTable();
      };
      htr.append(th);
    }
    thead.append(htr);

    const tbody = el('tbody');
    for (const d of sorted) {
      const slug = slugOf(d), pct = maxRatio > 0 ? Math.round(((d.ratio || 0) / maxRatio) * 100) : 0;
      const tr = el('tr', 'data-row');
      tr.dataset.item = slug;
      const tdMoment = el('td'); tdMoment.append(momentBadge(slug));
      const tdItem = el('td'); tdItem.append(el('span', 'td-item', nameOf(d)));
      const tdPrice = el('td'), price = el('span', 'td-price', String(d.weightedAvgPrice ?? '—'));
      price.append(el('small', null, 'pt')); tdPrice.append(price);
      const tdRatio = el('td'), bar = el('div', 'rank-bar'), track = el('div', 'rank-track'), fill = el('div', 'rank-fill');
      fill.style.width = pct + '%'; track.append(fill);
      bar.append(el('span', 'rank-val', String(d.ratio ?? '—')), track); tdRatio.append(bar);
      tr.append(tdMoment, tdItem, tdPrice, tdRatio);

      const details = el('tr', 'details-row'), open = tableState.expanded.has(slug);
      details.style.display = open ? 'table-row' : 'none';
      const td = el('td'); td.colSpan = COLUMNS.length;
      const box = el('div', 'item-details'), canvas = el('canvas'), info = el('div', 'details-info');
      canvas.id = `chart-${slug.replace(/[^a-zA-Z0-9]/g, '')}`; canvas.width = 400; canvas.height = 200;
      const p1 = el('p'), p2 = el('p');
      p1.append(el('strong', null, 'Quantité totale:'), ` ${d.totalQty || 'N/A'}`);
      p2.append(el('strong', null, "Nombre d'ordres:"), ` ${d.orders || 'N/A'}`);
      info.append(p1, p2); box.append(canvas, info); td.append(box); details.append(td);

      tr.addEventListener('click', async () => {      // ouvre / ferme la courbe 90 jours (gardé ouvert après un tri)
        if (details.style.display === 'none') { details.style.display = 'table-row'; tableState.expanded.add(slug); await loadItemDetails(slug); }
        else { details.style.display = 'none'; tableState.expanded.delete(slug); }
      });
      tbody.append(tr, details);
    }
    table.append(thead, tbody);
    wrap.append(meta, table);
    document.getElementById('result').replaceChildren(wrap);
    // après l'insertion dans la page : redessine les courbes des lignes restées ouvertes (sinon canvas introuvable)
    tableState.expanded.forEach(slug => { if (data.some(d => slugOf(d) === slug)) loadItemDetails(slug); });
  }

  window._renderTableStyled = function(data, mode) {
    const result = document.getElementById('result');
    if (!data || data.length === 0) {
      const wrap = el('div', 'table-wrap'); wrap.append(el('div', 'empty-state', 'Aucune donnée disponible'));
      result.replaceChildren(wrap);
      return;
    }
    if (tableState.mode !== mode) tableState.expanded.clear();
    tableState.data = data; tableState.mode = mode;
    renderTable();
    loadVerdicts(data.map(slugOf));
  };

  // Courbe warframe.market sur 90 jours (ventes conclues) + verdict "bon moment pour vendre ?"
  // Données : /api/statistics/:slug (main.js). Texte inséré avec textContent uniquement.
  async function loadItemDetails(itemSlug) {
    const canvasId = `chart-${itemSlug.replace(/[^a-zA-Z0-9]/g, '')}`;
    const canvas = document.getElementById(canvasId);
    let verdict = canvas.parentElement.querySelector('.baro-verdict');
    if (!verdict) {
      verdict = document.createElement('div');
      canvas.parentElement.insertBefore(verdict, canvas);
    }
    verdict.className = 'baro-verdict inconnu';
    verdict.textContent = 'Chargement des 90 derniers jours sur warframe.market…';
    try {
      const res = await fetch(`/api/statistics/${encodeURIComponent(itemSlug)}`);
      const stats = await res.json();
      if (!res.ok) throw new Error(stats.error || `HTTP ${res.status}`);
      if (canvas.chart) canvas.chart.destroy();

      if (!verdictCache.has(itemSlug)) setVerdict(itemSlug, stats.verdict);   // met aussi la pastille à jour
      verdict.className = `baro-verdict ${stats.verdict.level}`;
      verdict.textContent = stats.verdict.text + (stats.rank != null ? `  —  rang ${stats.rank}` : '');
      if (!stats.series.length) { canvas.style.display = 'none'; return; }
      canvas.style.display = '';

      const s = stats.series;
      const labels = s.map(d => { const [, m, day] = d.date.split('-'); return `${day}/${m}`; });
      const ctx = canvas.getContext('2d');
      const gradient = ctx.createLinearGradient(0, 0, 0, 200);
      gradient.addColorStop(0, 'rgba(200, 168, 75, 0.25)');
      gradient.addColorStop(1, 'rgba(200, 168, 75, 0.0)');
      const tick = { color: '#7a8a9a', font: { family: 'Share Tech Mono', size: 10 } };

      canvas.chart = new Chart(ctx, {
        data: {
          labels,
          datasets: [
            { type: 'line', label: 'Prix médian (moy. 7 j)', data: s.map(d => d.med7 != null ? +d.med7.toFixed(1) : null),
              yAxisID: 'y', borderColor: '#c8a84b', backgroundColor: gradient, fill: true, borderWidth: 2,
              pointRadius: 0, pointHoverRadius: 4, tension: 0.35, order: 1 },
            { type: 'line', label: 'Prix médian du jour', data: s.map(d => d.med != null ? +d.med.toFixed(1) : null),
              yAxisID: 'y', borderColor: 'rgba(200, 168, 75, 0.45)', borderWidth: 1, borderDash: [3, 3],
              pointRadius: 0, pointHoverRadius: 3, tension: 0.2, order: 2 },
            { type: 'bar', label: 'Ventes / jour', data: s.map(d => d.vol), yAxisID: 'y1',
              backgroundColor: 'rgba(58, 143, 200, 0.28)', borderWidth: 0, order: 3 },
          ]
        },
        options: {
          responsive: true,
          interaction: { intersect: false, mode: 'index' },
          plugins: {
            legend: { labels: { color: '#7a8a9a', font: { family: 'Rajdhani', size: 11 }, boxWidth: 12 } },
            tooltip: {
              backgroundColor: '#111820', borderColor: 'rgba(200, 168, 75, 0.35)', borderWidth: 1,
              titleColor: '#7a8a9a', bodyColor: '#c8a84b', padding: 10,
              callbacks: { label: c => `  ${c.dataset.label} : ${c.parsed.y}${c.dataset.yAxisID === 'y' ? ' pt' : ''}` }
            }
          },
          scales: {
            y: { position: 'left', grid: { color: 'rgba(200, 168, 75, 0.08)' }, ticks: { ...tick, callback: v => v + ' pt' } },
            y1: { position: 'right', beginAtZero: true, grid: { drawOnChartArea: false }, ticks: { ...tick, callback: v => v + ' /j' } },
            x: { grid: { color: 'rgba(200, 168, 75, 0.04)' }, ticks: { ...tick, maxRotation: 0, autoSkip: true, maxTicksLimit: 10 } }
          }
        }
      });
    } catch (error) {
      console.error('Erreur lors du chargement des détails:', error);
      verdict.className = 'baro-verdict inconnu';
      verdict.textContent = `Courbe warframe.market indisponible : ${error.message}`;
    }
  }
</script>

</body>
</html>
