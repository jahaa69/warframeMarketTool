  <line x1="340" y1="168" x2="340" y2="184" stroke="#c8a84b" stroke-width="0.7" opacity="0.5" style="fill:rgb(0, 0, 0);stroke:rgb(200, 168, 75);color:rgb(251, 251, 254);stroke-width:0.7px;stroke-linecap:butt;stroke-linejoin:miter;opacity:0.5;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  <line x1="276" y1="120" x2="292" y2="120" stroke="#c8a84b" stroke-width="0.7" opacity="0.5" style="fill:rgb(0, 0, 0);stroke:rgb(200, 168, 75);color:rgb(251, 251, 254);stroke-width:0.7px;stroke-linecap:butt;stroke-linejoin:miter;opacity:0.5;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  <line x1="388" y1="120" x2="404" y2="120" stroke="#c8a84b" stroke-width="0.7" opacity="0.5" style="fill:rgb(0, 0, 0);stroke:rgb(200, 168, 75);color:rgb(251, 251, 254);stroke-width:0.7px;stroke-linecap:butt;stroke-linejoin:miter;opacity:0.5;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

  <!-- Texte WMT sous l'icône -->
  <text x="340" y="248" text-anchor="middle" font-family="'Rajdhani', sans-serif" font-size="22" font-weight="700" fill="#c8a84b" letter-spacing="6" style="fill:rgb(200, 168, 75);stroke:none;color:rgb(251, 251, 254);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Rajdhani&quot;, sans-serif;font-size:22px;font-weight:700;text-anchor:middle;dominant-baseline:auto">WMT</text>
  <text x="340" y="268" text-anchor="middle" font-family="'Share Tech Mono', monospace" font-size="10" fill="#3a4a5a" letter-spacing="2" style="fill:rgb(58, 74, 90);stroke:none;color:rgb(251, 251, 254);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Share Tech Mono&quot;, monospace;font-size:10px;font-weight:400;text-anchor:middle;dominant-baseline:auto">market tool</text>

</svg>