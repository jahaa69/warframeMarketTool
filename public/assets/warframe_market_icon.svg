  <polygon points="340,50 410,120 340,190 270,120" fill="none" stroke="#c8a84b" stroke-width="1.5" opacity="0.5" style="fill:none;stroke:rgb(200, 168, 75);color:rgb(251, 251, 254);stroke-width:1.5px;stroke-linecap:butt;stroke-linejoin:miter;opacity:0.5;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

  <!-- Losange intermédiaire -->
